<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DARAE V3</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#070707;color:#fff;padding:16px}.container{max-width:720px;margin:0 auto}h1{text-align:center;margin:18px 0;font-size:30px}h1 span{color:#ff2222}.card{background:#141414;border:1px solid #222;border-radius:14px;padding:14px;margin:10px 0}input,textarea{width:100%;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:10px;color:#fff;padding:13px}textarea{min-height:130px;direction:ltr;text-align:left}.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:800;cursor:pointer}.btn-red{background:#ff1a1a;color:#fff}.tabs{display:flex;gap:6px;margin:10px 0}.tab{flex:1;padding:9px;background:#1a1a1a;border:1px solid #222;border-radius:8px;text-align:center;cursor:pointer;font-size:12px}.tab.active{background:#ff1a1a}.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:800;margin:2px}.critical{background:#ff0000}.high{background:#ff6a00}.medium{background:#ffb700;color:#000}.low{background:#333}.safe{background:#00c853}.item{background:#0f0f0f;border:1px solid #222;border-radius:9px;padding:10px;margin:7px 0;font-size:13px}.score{font-size:44px;font-weight:900;text-align:center}.log{font-size:11px;color:#666}</style></head><body><div class="container"><h1>DARAE <span>V3</span> REAL SERVER</h1><div class="tabs"><div class="tab active" onclick="sw('url',this)">رابط حقيقي مع سيرفر</div><div class="tab" onclick="sw('code',this)">كود</div><div class="tab" onclick="sw('file',this)">ملف</div></div><div class="card" id="urlBox"><input id="urlInput" placeholder="https://example.com/page.php"></div><div class="card" id="codeBox" style="display:none"><textarea id="codeInput" placeholder="<?php eval($_POST['cmd']); ?>"></textarea></div><div class="card" id="fileBox" style="display:none"><input type="file" id="fileInput"></div><button class="btn btn-red" id="scanBtn" onclick="startScan()">افحص مع السيرفر الحقيقي</button><div class="card" id="resBox" style="display:none"><div id="scoreArea"></div><div id="logArea"></div><div id="details"></div></div></div><script>function sw(t,el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.getElementById('urlBox').style.display=t=='url'?'block':'none';document.getElementById('codeBox').style.display=t=='code'?'block':'none';document.getElementById('fileBox').style.display=t=='file'?'block':'none';}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}async function startScan(){const btn=document.getElementById('scanBtn');btn.innerText='جاري الفحص...';btn.disabled=true;let payload={};if(document.getElementById('urlBox').style.display!='none'){let u=document.getElementById('urlInput').value.trim();if(!u){alert('حط رابط');btn.disabled=false;return;}if(!u.startsWith('http'))u='https://'+u;payload.url=u;}else if(document.getElementById('codeBox').style.display!='none'){payload.code=document.getElementById('codeInput').value;}else{let f=document.getElementById('fileInput').files[0];payload.code=await f.text();}try{let r=await fetch('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});let data=await r.json();const box=document.getElementById('resBox');box.style.display='block';document.getElementById('scoreArea').innerHTML=`<div class="score">${data.score}/100</div><div style="text-align:center"><span class="badge ${data.color}">${data.label}</span></div>`;document.getElementById('logArea').innerHTML=(data.logs||[]).map(l=>`<div class="log">> ${esc(l)}</div>`).join('');document.getElementById('details').innerHTML=data.findings.map(f=>`<div class="item"><span class="badge ${f.risk}">${f.risk}</span> <b>${f.name}</b><br><small>${f.desc}</small><pre>${esc(f.evidence||'')}</pre></div>`).join('');box.scrollIntoView({behavior:'smooth'});}catch(e){alert(e.message);}btn.innerText='افحص مع السيرفر الحقيقي';btn.disabled=false;}</script></body></html>
