<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DARAE V2</title>
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-black text-white p-4">
<div class="max-w-2xl mx-auto">
<h1 class="text-3xl font-black text-center mt-10">🛡️ DARAE V2</h1>
<input id="url" placeholder="https://example.com" class="w-full p-4 rounded-xl bg-zinc-900 border border-zinc-700 mt-6">
<button onclick="check()" class="w-full mt-4 bg-red-600 p-4 rounded-xl font-bold">افحص PHP2Shell الآن</button>
<pre id="res" class="mt-4 bg-zinc-900 p-4 rounded-xl">النتيجة هنا...</pre>
</div>
<script>
async function check(){
 let u=document.getElementById('url').value;
 let r=await fetch('/scan/php2shell',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u})});
 let j=await r.json();
 document.getElementById('res').innerText=JSON.stringify(j,null,2);
}
</script>
</body>
</html>
