<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>DARAE</title><style>body{background:#0a0a0a;color:#fff;font-family:sans-serif;padding:20px;max-width:500px;margin:auto}input{width:100%;padding:14px;border-radius:12px;border:1px solid #333;background:#111;color:#fff}button{width:100%;padding:14px;border-radius:12px;border:none;font-weight:bold;margin-top:10px}#scanBtn{background:#00ff88}#waBtn{background:#25D366;color:#fff;display:block;text-align:center;text-decoration:none;padding:14px;border-radius:12px;margin-top:10px}#codeBox{display:none;background:#111;border:1px solid #00ff88;padding:15px;border-radius:12px;margin-top:15px}#result{margin-top:20px;background:#111;padding:15px;border-radius:12px;display:none}</style></head><body><h1 style="color:#00ff88;text-align:center">🛡️ DARAE</h1><input id="urlInput" placeholder="https://example.com"><button id="scanBtn">🔍 فحص سريع</button><a id="waBtn">💬 توثيق واتساب</a><div id="codeBox"><input id="codeInput" placeholder="DARAE-1234"><button id="activateBtn" style="background:#00ff88">تفعيل</button><p id="codeMsg"></p></div><div id="result"></div><script>const N="967780194210";document.getElementById('waBtn').onclick=function(){let u=document.getElementById('urlInput').value||"موقعي";this.href=`https://wa.me/${N}?text=${encodeURIComponent("اريد التوثيق "+u)}`;document.getElementById('codeBox').style.display='block'};document.getElementById('scanBtn').onclick=async()=>{let u=document.getElementById('urlInput').value;let r=document.getElementById('result');r.style.display='block';r.innerHTML='⏳ جاري الفحص...';let d=await fetch(`/api/scan?url=${encodeURIComponent(u)}`).then(r=>r.json());r.innerHTML=`<pre>${JSON.stringify(d,null,2)}</pre>`};document.getElementById('activateBtn').onclick=async()=>{let c=document.getElementById('codeInput').value;let u=document.getElementById('urlInput').value;let r=document.getElementById('result');r.style.display='block';r.innerHTML='🔍 فحص عميق...';let d=await fetch(`/api/scan?url=${encodeURIComponent(u)}&deep=true&code=${c}`).then(r=>r.json());r.innerHTML=`<h3>📊 تقرير دارع</h3><pre>${JSON.stringify(d,null,2)}</pre>`};</script></body></html>
