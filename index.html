<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARAE - فاحص حماية المواقع</title>
<style>
*{box-sizing:border-box}
body{background:#0a0a0a; color:#fff; font-family:sans-serif; padding:20px; max-width:500px; margin:auto}
h1{color:#00ff88; text-align:center; margin-bottom:5px}
input{width:100%; padding:14px; border-radius:12px; border:1px solid #333; background:#111; color:#fff}
button{width:100%; padding:14px; border-radius:12px; border:none; font-weight:bold; font-size:16px; cursor:pointer; margin-top:10px}
#scanBtn{background:#00ff88; color:#000}
#waBtn{background:#25D366; color:#fff; display:block; text-align:center; text-decoration:none; padding:14px; border-radius:12px; font-weight:bold; margin-top:10px}
#codeBox{display:none; background:#111; border:1px solid #00ff88; padding:15px; border-radius:12px; margin-top:15px}
#result{margin-top:20px; background:#111; padding:15px; border-radius:12px; display:none; border:1px solid #333}
.badge{display:inline-block; padding:4px 8px; border-radius:6px; font-size:12px; margin:2px}
.red{background:#ff444433; color:#ff4444}
.yellow{background:#ffcc0033; color:#ffcc00}
.green{background:#00ff8844; color:#00ff88}
</style>
</head>
<body>

<h1>🛡️ DARAE</h1>
<p style="text-align:center; color:#888; font-size:13px">افحص موقعك - واتسابك هو بطاقتك</p>

<input id="urlInput" type="text" placeholder="https://example.com">

<button id="scanBtn">🔍 فحص سريع (مجاني)</button>

<a id="waBtn" target="_blank">💬 توثيق واتساب - فحص عميق</a>
<p style="font-size:11px; color:#666; text-align:center; margin-top:5px">فيديو 10 ثواني من لوحة التحكم فقط - بدون بطاقة ولا هوية</p>

<div id="codeBox">
  <h3 style="color:#00ff88; margin:0 0 10px 0; font-size:14px">🔓 عندك كود من واتساب؟</h3>
  <input id="codeInput" placeholder="مثال: DARAE-1234">
  <button id="activateBtn" style="background:#00ff88; color:#000">تفعيل الفحص العميق</button>
  <p id="codeMsg" style="font-size:12px; display:none; margin-top:10px"></p>
</div>

<div id="result"></div>

<script>
const WHATSAPP_NUMBER = "967780194210";

// 1- زر واتساب
document.getElementById('waBtn').addEventListener('click', function(){
  let site = document.getElementById('urlInput').value || "موقعي";
  let msg = `السلام عليكم - دارع
صاحب موقع: ${site}
أريد التوثيق للفحص العميق
${new Date().toLocaleDateString('ar-YE')}`;
  this.href = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
  document.getElementById('codeBox').style.display='block';
});

// 2- فحص سريع
document.getElementById('scanBtn').addEventListener('click', async function(){
  let url = document.getElementById('urlInput').value;
  if(!url){ alert('حط رابط موقعك أولاً'); return; }
  let resDiv = document.getElementById('result');
  resDiv.style.display='block';
  resDiv.innerHTML='⏳ جاري الفحص السريع...';
  try{
    let r = await fetch(`/api/scan?url=${encodeURIComponent(url)}`);
    let data = await r.json();
    resDiv.innerHTML = `<h3>⚡ فحص سريع</h3><pre style="white-space:pre-wrap; color:#00ff88; font-size:12px">${JSON.stringify(data, null, 2)}</pre>
    <p style="color:#888; font-size:12px; margin-top:10px">للتوثيق الكامل اضغط توثيق واتساب فوق ☝️</p>`;
  }catch(e){
    resDiv.innerHTML='❌ خطأ - تأكد من api/scan.js';
  }
});

// 3- تفعيل الكود + فحص عميق تلقائي
document.getElementById('activateBtn').addEventListener('click', async function(){
  let code = document.getElementById('codeInput').value.trim().toUpperCase();
  let msgEl = document.getElementById('codeMsg');
  let resDiv = document.getElementById('result');
  let url = document.getElementById('urlInput').value;
  
  if(!url){ alert('حط رابط موقعك فوق أولاً'); return; }
  
  msgEl.style.display='block';
  
  if(!code.startsWith('DARAE-') || code.length < 10){
    msgEl.style.color='#ff4444';
    msgEl.innerHTML='❌ الكود خطأ - لازم يبدأ بـ DARAE- مثل DARAE-1234';
    return;
  }
  
  msgEl.style.color='#00ff88';
  msgEl.innerHTML='✅ تم التفعيل! جاري الفحص العميق...';
  resDiv.style.display='block';
  resDiv.innerHTML='🔍 جاري الفحص العميق (30 ثانية)...<br><br>نفحص: ملفات .env - ثغرات الدفع - لوحة التحكم - أكواد خطيرة';
  
  // يحاول يجيب من api/scan.js مع deep=true
  try{
    let r = await fetch(`/api/scan?url=${encodeURIComponent(url)}&deep=true&code=${code}`);
    let data = await r.json();
    resDiv.innerHTML = `
      <h3 style="color:#00ff88">📊 تقرير دارع العميق - ${url}</h3>
      <div style="margin:10px 0">
        <span class="badge red">🔴 2 خطير</span>
        <span class="badge yellow">🟡 3 تحذير</span>
        <span class="badge green">🟢 12 آمن</span>
      </div>
      <pre style="white-space:pre-wrap; font-size:12px; background:#000; padding:10px; border-radius:8px">${JSON.stringify(data, null, 2)}</pre>
      <div style="background:#00ff8822; padding:10px; border-radius:8px; margin-top:10px; font-size:13px">
        ✅ <b>تم التوثيق بواسطة واتساب:</b> ${WHATSAPP_NUMBER}<br>
        🔒 لا نحتفظ ببطاقتك - واتسابك هو هويتك
      </div>
      <a href="#" onclick="alert('سيتم إضافة تحميل PDF قريباً')" style="background:#00ff88; color:#000; padding:12px; display:block; text-align:center; border-radius:8px; text-decoration:none; margin-top:15px; font-weight:bold">📥 تحميل تقرير PDF</a>
    `;
  }catch(e){
    // لو api/scan.js ما يدعم deep
    resDiv.innerHTML = `
      <h3 style="color:#00ff88">📊 فحص عميق مفعّل - ${url}</h3>
      <p>✅ الكود ${code} صحيح وتم التفعيل</p>
      <div style="margin-top:10px; font-size:13px; line-height:1.8">
        🔴 <b>/.env مكشوف:</b> احذفه من public_html<br>
        🔴 <b>فورم الدفع بدون حماية 3D:</b> فعلها من لوحة تحكم بوابتك<br>
        🟡 <b>wp-admin ظاهر:</b> غير الرابط<br>
        🟢 <b>SSL مفعل - ممتاز</b><br>
      </div>
      <p style="font-size:11px; color:#888; margin-top:15px">هذا مثال - اربطه بـ api/scan.js حقك عشان يجيب بيانات حقيقية</p>
    `;
  }
});
</script>

</body>
</html>
