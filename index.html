<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARAE - فاحص حماية المواقع</title>
<style>
body{background:#0a0a0a; color:#fff; font-family:sans-serif; padding:20px; max-width:500px; margin:auto}
h1{color:#00ff88; text-align:center}
input{width:100%; padding:14px; border-radius:12px; border:1px solid #333; background:#111; color:#fff; box-sizing:border-box}
button{width:100%; padding:14px; border-radius:12px; border:none; font-weight:bold; font-size:16px; cursor:pointer; margin-top:10px}
#scanBtn{background:#00ff88; color:#000}
#waBtn{background:#25D366; color:#fff; display:block; text-align:center; text-decoration:none; padding:14px; border-radius:12px; font-weight:bold; margin-top:10px}
#codeBox{display:none; background:#111; border:1px solid #00ff88; padding:15px; border-radius:12px; margin-top:15px}
</style>
</head>
<body>

<h1>🛡️ DARAE</h1>
<p style="text-align:center; color:#888; font-size:13px">افحص موقعك في 5 ثواني</p>

<input id="urlInput" type="text" placeholder="https://example.com">

<button id="scanBtn">🔍 فحص سريع</button>

<a id="waBtn" target="_blank">💬 توثيق واتساب - فحص عميق</a>
<p style="font-size:11px; color:#666; text-align:center">فيديو 10 ثواني من لوحة التحكم فقط - بدون بطاقة</p>

<div id="codeBox">
  <h3 style="color:#00ff88; margin:0 0 10px 0; font-size:14px">🔓 عندك كود من واتساب؟</h3>
  <input id="codeInput" placeholder="DARAE-XXXX">
  <button id="activateBtn" style="background:#00ff88; color:#000; margin-top:10px">تفعيل الفحص العميق</button>
  <p id="codeMsg" style="font-size:12px; display:none"></p>
</div>

<div id="result" style="margin-top:20px; background:#111; padding:15px; border-radius:12px; display:none"></div>

<script>
const WHATSAPP_NUMBER = "967780194210";

// زر واتساب
document.getElementById('waBtn').addEventListener('click', function(){
  let site = document.getElementById('urlInput').value || "موقعي";
  let msg = `السلام عليكم - دارع
أنا صاحب موقع: ${site}
أريد التوثيق للفحص العميق`;
  this.href = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
  document.getElementById('codeBox').style.display='block';
});

// زر الفحص السريع - يتصل بـ api/scan.js حقك
document.getElementById('scanBtn').addEventListener('click', async function(){
  let url = document.getElementById('urlInput').value;
  if(!url){ alert('حط رابط موقعك'); return; }
  let resDiv = document.getElementById('result');
  resDiv.style.display='block';
  resDiv.innerHTML='⏳ جاري الفحص...';
  try{
    let r = await fetch(`/api/scan?url=${encodeURIComponent(url)}`);
    let data = await r.json();
    resDiv.innerHTML = `<pre style="white-space:pre-wrap; color:#00ff88">${JSON.stringify(data, null, 2)}</pre>`;
  }catch(e){
    resDiv.innerHTML='❌ خطأ في الفحص - تأكد من api/scan.js';
  }
});

// تفعيل الكود
document.getElementById('activateBtn').addEventListener('click', function(){
  let code = document.getElementById('codeInput').value.trim().toUpperCase();
  let msgEl = document.getElementById('codeMsg');
  msgEl.style.display='block';
  if(code.startsWith('DARAE-') && code.length >= 10){
    msgEl.style.color='#00ff88';
    msgEl.innerHTML='✅ تم التفعيل! الآن تقدر تستخدم الفحص العميق';
  }else{
    msgEl.style.color='#ff4444';
    msgEl.innerHTML='❌ الكود يبدأ بـ DARAE-';
  }
});
</script>

</body>
</html>
