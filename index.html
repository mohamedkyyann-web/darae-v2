<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARAE V22 Global - OWASP Scanner</title>
<style>
*{box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:system-ui;padding:15px;margin:0}
h2{text-align:center}
#urlInput{width:100%;padding:14px;border-radius:10px;border:1px solid #333;background:#1a1a1a;color:#fff;direction:ltr}
.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:15px 0}
.btns button,.btns a{flex:1;min-width:140px;padding:12px;border-radius:10px;border:none;font-weight:bold;text-align:center;text-decoration:none;cursor:pointer}
.btn-green{background:#22c55e;color:#fff}
.btn-dark{background:#222;border:1px solid #ef4444 !important;color:#ef4444}
.btn-wa{background:#25D366;color:#fff}
#deepBox{display:none;border:2px solid #ef4444;padding:15px;border-radius:12px;background:#1a0000;margin-top:15px}
#deepBox input{width:100%;padding:12px;border-radius:8px;border:none;background:#111;color:#fff;margin:10px 0}
.card{border-radius:10px;padding:12px;margin:10px 0;background:#111}
.badge{padding:2px 6px;border-radius:6px;font-size:10px;background:#333}
</style>
</head>
<body>
<h2>🌍 DARAE V22 Global - OWASP Top 10</h2>
<div style="text-align:center;margin-bottom:10px">
<button onclick="setLang('ar')" style="padding:6px 12px;border-radius:6px;background:#333;color:#fff;border:1px solid #555">عربي</button>
<button onclick="setLang('en')" style="padding:6px 12px;border-radius:6px;background:#333;color:#fff;border:1px solid #555">English</button>
</div>
<input id="urlInput" placeholder="https://example.com" value="https://dkyyann-web.vercel.app">
<div class="btns">
  <button class="btn-green" onclick="doScan()">Quick Scan (12)</button>
  <button class="btn-dark" onclick="document.getElementById('deepBox').style.display='block'">🔓 Global Scan (70)</button>
  <a id="waBtn" class="btn-wa" href="https://wa.me/967780194210" target="_blank">WhatsApp 780194210</a>
</div>
<div id="deepBox">
  <h3 style="color:#ef4444;margin:0">🔴 DARAE V22 Global - 70 Checks</h3>
  <p id="deepDesc" style="color:#ccc;font-size:12px">OWASP Top 10 + WordPress + Secrets + Backup files. Send cPanel screenshot for code.</p>
  <input id="codeInput" placeholder="DARAE-XXXX">
  <button onclick="doDeepScan()" style="width:100%;background:#ef4444;color:#fff;padding:12px;border-radius:8px;border:none;font-weight:bold">Start 70 Checks</button>
</div>
<div id="result"></div>
<script>
let lang='ar';
function setLang(l){ lang=l; document.documentElement.dir=l==='ar'?'rtl':'ltr'; document.documentElement.lang=l; document.getElementById('deepDesc').innerText = l==='ar' ? 'فحص OWASP Top 10 + ووردبريس + مفاتيح + نسخ احتياطي. أرسل سكرين cPanel للكود.' : 'OWASP Top 10 + WordPress + Secrets + Backups. Send cPanel screenshot for code.'; }
function renderResult(d){
  var r=document.getElementById('result');
  var color = d.score>80 ? '#22c55e' : d.score>50 ? '#f59e0b' : '#ef4444';
  var html = `<div class="card" style="border:2px solid ${color}"><h3 style="color:${color};margin:0">${lang==='ar' ? 'النتيجة' : 'Score'}: ${d.score}/100 - ${d.status}</h3><p style="font-size:12px;color:#aaa">Checks: ${d.totalChecks} | Critical: ${d.critical} | OWASP: ${d.owasp||''}</p></div>`;
  (d.vulnerabilities||[]).forEach(v=>{
    var c=v.severity=='Critical'?'#ef4444':'#f59e0b';
    html+=`<div class="card" style="border-right:4px solid ${c}"><span class="badge">${v.owasp||''}</span> <b style="color:${c}">${v.title}</b><br><span style="font-size:13px">${v.desc}</span>${v.proof?`<br><code style="font-size:11px;color:#f59e0b;word-break:break-all">Proof: ${v.proof}</code>`:''}${v.impact?`<br><span style="color:#ef4444;font-size:12px">⚠️ ${v.impact}</span>`:''}${v.fix?`<br><div style="background:#052e16;border:1px solid #22c55e;padding:8px;border-radius:6px;margin-top:8px"><span style="color:#22c55e;font-size:12px;font-weight:bold">✅ Fix:</span><br><span style="font-size:12px;color:#bbf7d0">${v.fix}</span></div>`:''}</div>`;
  });
  html+=`<details style="margin-top:15px"><summary style="color:#666;font-size:12px">Logs</summary><pre style="font-size:10px;color:#666;white-space:pre-wrap">${(d.logs||[]).join('\n')}</pre></details><div style="margin-top:15px;text-align:center"><a href="https://wa.me/967780194210?text=Fix%20my%20site%20${encodeURIComponent(d.url)}%20Score%20${d.score}" style="background:#25D366;color:#fff;padding:12px 20px;border-radius:8px;text-decoration:none;font-weight:bold">${lang==='ar' ? 'أصلح لي الآن - واتساب 780194210' : 'Fix Now - WhatsApp'}</a></div>`;
  r.innerHTML=html;
}
function doScan(){ var url=document.getElementById('urlInput').value; if(!url) return alert("Enter URL"); document.getElementById('result').innerHTML="Scanning..."; fetch("/api/scan?url="+encodeURIComponent(url)+"&lang="+lang).then(r=>r.json()).then(renderResult); }
function doDeepScan(){ var url=document.getElementById('urlInput').value; var code=document.getElementById('codeInput').value; if(!url||!code) return alert("URL + Code"); document.getElementById('result').innerHTML="Global scanning 70 checks..."; fetch("/api/scan?url="+encodeURIComponent(url)+"&deep=true&code="+encodeURIComponent(code)+"&lang="+lang).then(r=>r.json()).then(renderResult); }
</script>
</body>
</html>
