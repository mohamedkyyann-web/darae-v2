<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARAE - فحص موقعك قبل الهكر</title>
<style>
*{box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:system-ui,Tahoma;padding:15px;margin:0;direction:rtl}
h2{text-align:center;font-size:20px;margin:15px 0}
#urlInput{width:100%;padding:14px;border-radius:10px;border:1px solid #333;background:#1a1a1a;color:#fff;font-size:14px;text-align:left;direction:ltr}
.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:15px 0}
.btns button,.btns a{flex:1;min-width:140px;padding:12px 10px;border-radius:10px;border:none;font-size:13px;font-weight:bold;text-align:center;text-decoration:none;cursor:pointer}
.btn-green{background:#22c55e;color:#fff}
.btn-dark{background:#222;border:1px solid #ef4444 !important;color:#ef4444}
.btn-wa{background:#25D366;color:#fff}
#deepBox{display:none;border:2px solid #ef4444;padding:15px;border-radius:12px;background:#1a0000;margin-top:15px}
#deepBox input{width:100%;padding:12px;border-radius:8px;border:none;background:#111;color:#fff;margin:10px 0}
#result{margin-top:15px;background:#111;padding:12px;border-radius:10px;white-space:pre-wrap;font-size:13px;word-break:break-all}
</style>
</head>
<body>

<h2>🔍 DARAE - فحص موقعك قبل الهكر</h2>

<input id="urlInput" placeholder="https://example.com" oninput="updateWALink()" value="https://dkyyann-web.vercel.app">

<div class="btns">
  <button class="btn-green" onclick="doScan()">فحص سريع مجاني</button>
  <button class="btn-dark" onclick="document.getElementById('deepBox').style.display='block'">🔓 طلب فحص هجومي</button>
  <a id="waBtn" class="btn-wa" href="https://wa.me/967780194210" target="_blank">واتساب 780194210</a>
</div>

<div id="deepBox">
  <h3 style="color:#ef4444;margin:0 0 10px 0">🔴 فحص هجومي بتوثيق</h3>
  <p style="color:#ccc;font-size:12px;line-height:1.6;margin:0">بدون رفع ملف - فقط سكرين cPanel. بعدها تحصل كود DARAE صالح 24 ساعة لموقعك فقط.</p>
  <input id="codeInput" placeholder="الصق كود DARAE-XXXX هنا">
  <button onclick="doDeepScan()" style="width:100%;background:#ef4444;color:#fff;padding:12px;border-radius:8px;border:none;font-weight:bold">ابدأ الفحص الهجومي الآن</button>
  <div style="margin-top:10px;background:#0a0a0a;border:1px dashed #f59e0b;padding:8px;border-radius:6px;font-size:11px;color:#999">
    ✅ نفحص: .env, SQL بـ ' , XSS | ❌ لا نفحص: RCE, IDOR (تحتاج فحص خاص)
  </div>
</div>

<div id="result"></div>

<script>
function updateWALink(){
  var el=document.getElementById('urlInput');
  var url=el&&el.value?el.value:"موقعي";
  var msg="السلام عليكم، اريد فحص هجومي لموقعي: "+url+" - مستعد لارسال سكرين cPanel";
  var link="https://wa.me/967780194210?text="+encodeURIComponent(msg);
  var btn=document.getElementById('waBtn');
  if(btn) btn.href=link;
}
function doScan(){
  var url=document.getElementById('urlInput').value;
  if(!url) return alert("ادخل الرابط");
  document.getElementById('result').innerText="جاري الفحص...";
  fetch("/api/scan?url="+encodeURIComponent(url)).then(r=>r.json()).then(d=>{document.getElementById('result').innerText=JSON.stringify(d,null,2)});
}
function doDeepScan(){
  var url=document.getElementById('urlInput').value;
  var code=document.getElementById('codeInput').value;
  if(!url||!code) return alert("ادخل الرابط والكود");
  document.getElementById('result').innerText="جاري الفحص الهجومي...";
  fetch("/api/scan?url="+encodeURIComponent(url)+"&deep=true&code="+encodeURIComponent(code)).then(r=>r.json()).then(d=>{document.getElementById('result').innerText=JSON.stringify(d,null,2)});
}
document.addEventListener('DOMContentLoaded', updateWALink);
</script>
</body>
</html>
